launch_command = "CUDA_VISIBLE_DEVICES=0 ninfer-serve /models/SELECT-4BIT.ninfer --model-id qwen-4bit --host 127.0.0.1 --port 8000 --max-context 32768 --kv-capacity 32768 --max-concurrency 8 --kv-dtype int8"
request_overrides = {chat_template_kwargs = {enable_thinking = false}}

[[engines]]
id = "ninfer-2-experimental"
engine = "ninfer-3090"
version = "d8c29253f2c0845611a794d87057950107a4956b"
model = "qwen-4bit"
base_url = "http://127.0.0.1:8000/v1"
gpu_count = 2
parallelism = "pipeline-2-unqualified"
weight_format = "ninfer-v3-4bit-candidate"
kv_format = "int8"
launch_command = "unknown: Linux pipeline route is unqualified; no TP or DFlash multi-GPU claim"
request_overrides = {chat_template_kwargs = {enable_thinking = false}}

# Prompt sizes are measured by server usage, not inferred from repetition counts.
# For a 27B campaign, replace ALL model artifacts with the SAME source revision.
[[cases]]
id = "smoke"
fixture = "fixtures/text.json"
requests = 2
concurrency = 1
max_tokens = 32

