request_overrides = {chat_template_kwargs = {enable_thinking = false}}

[[engines]]
id = "llamacpp-1-f16"
engine = "llama.cpp"
version = "5047748f114564fcf271e6a648f60e2d2eae6264"
model = "qwen-4bit"
base_url = "http://127.0.0.1:8000/v1"
weight_format = "GGUF-Q4_K_M-candidate"
kv_format = "f16"
launch_command = "CUDA_VISIBLE_DEVICES=0 llama-server --model /models/SELECT-4BIT.gguf --alias qwen-4bit --n-gpu-layers 999 --ctx-size 32768 --cache-type-k f16 --cache-type-v f16 --port 8000"
