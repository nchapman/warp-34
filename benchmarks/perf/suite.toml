kv_format = "auto-fp16"
launch_command = "CUDA_VISIBLE_DEVICES=0,1 vllm serve nchapman/Qwen3.5-4B-W4A16-GPTQ --dtype half --tensor-parallel-size 2 --max-model-len 32768 --port 8000"
request_overrides = {chat_template_kwargs = {enable_thinking = false}}

[[engines]]
