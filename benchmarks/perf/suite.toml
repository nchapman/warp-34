# Copy and fill artifact/launch metadata before publishing. Nothing is launched by this file.
schema_version = 1

[run]
seed = 34
repetitions = 3
warmup_requests = 2
timeout_s = 300
max_inflight = 64

[engine_defaults]
cohort = "4bit-deployment-equivalent"
gpu_count = 1
gpu_ids = "unknown"
model_revision = "unknown"
source_model_revision = "unknown"
artifact_sha256 = "unknown"
tokenizer_revision = "unknown"
chat_template_sha256 = "unknown"
quantization_details = "unknown"
cache_config = "unknown"
parallelism = "single"
speculation = "none"

[[engines]]
id = "warp34-1-fp16"
engine = "warp-34"
version = "unknown"
model = "nchapman/Qwen3.5-4B-W4A16-GPTQ"
base_url = "http://127.0.0.1:8000/v1"
weight_format = "GPTQ-int4"
kv_format = "fp16"
launch_command = "CUDA_VISIBLE_DEVICES=0 ./target/release/w34 serve --model nchapman/Qwen3.5-4B-W4A16-GPTQ --kv-format fp16 --kv-pages 4096 --port 8000"
request_overrides = {chat_template_kwargs = {enable_thinking = false}}

[[engines]]
id = "warp34-2-tq4"
engine = "warp-34"
version = "unknown"
model = "nchapman/Qwen3.5-4B-W4A16-GPTQ"
base_url = "http://127.0.0.1:8000/v1"
gpu_count = 2
parallelism = "tensor-2"
weight_format = "GPTQ-int4"
kv_format = "tq4"
launch_command = "CUDA_VISIBLE_DEVICES=0,1 ./target/release/w34 serve --model nchapman/Qwen3.5-4B-W4A16-GPTQ --tp 2 --kv-format tq4 --kv-pages 4096 --port 8000"
request_overrides = {chat_template_kwargs = {enable_thinking = false}}

[[engines]]
id = "vllm-1-fp16"
engine = "vllm"
version = "0.31.0"
model = "nchapman/Qwen3.5-4B-W4A16-GPTQ"
base_url = "http://127.0.0.1:8000/v1"
weight_format = "GPTQ-int4"
kv_format = "auto-fp16"
launch_command = "CUDA_VISIBLE_DEVICES=0 vllm serve nchapman/Qwen3.5-4B-W4A16-GPTQ --dtype half --tensor-parallel-size 1 --max-model-len 32768 --port 8000"
request_overrides = {chat_template_kwargs = {enable_thinking = false}}

[[engines]]
