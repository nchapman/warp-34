# HGPTQ refresh; historical flash-next-serving.toml remains separate.
# Pod binary built from b7f5fdd; measured artifact hashes and full serving qualification.
# See flash-next-hgptq.md: qualification only, not a locked performance baseline.
# Drafter pin is the validated local-cache revision, NOT current HF main.
# Standalone HTTP campaign; launch one profile manually, never concurrently.
# Supported means tested on this pinned pod deployment, not quality certification.
# Original run manifests retain their pre-qualification unverified status.
# max-num-seqs=4 requests 16 serving state slots; seq1's 8 slots fail DFlash2.
# Workload concurrency remains one, with the same capacity setting for all modes.
schema_version = 1

[run]
seed = 34
repetitions = 3
warmup_requests = 1
max_inflight = 1
timeout_s = 1800

[presets.quick]
cases = ["short-chat", "coding-agent-replay"]
repetitions = 1
[presets.full]
cases = ["short-chat", "prefill-context-r16", "code-context-r64", "prefix-primed-r16", "coding-agent-replay"]
repetitions = 3
[presets.release]
cases = ["short-chat", "prefill-context-r16", "code-context-r64", "prefix-primed-r16", "coding-agent-replay"]
repetitions = 5

[engine_defaults]
support = "supported"
cohort = "flash-next-hgptq-serving"
engine = "warp-34"
