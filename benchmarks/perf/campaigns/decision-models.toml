# Decision-model (GLiDE / vllm-sr d3 / CausalLm) JevBench campaign (`POST /v1/systemone`).
# Launch profiles serially and select with `--engines <id>`.
schema_version = 1

[run]
seed = 34
repetitions = 3
warmup_requests = 2
max_inflight = 16
timeout_s = 180

[presets.quick]
cases = ["jevbench-smoke-c1", "jevbench-multiq-c1"]
repetitions = 1

[presets.full]
cases = [
  "jevbench-single-c1",
  "jevbench-single-c1-p2",
  "jevbench-single-c8",
  "jevbench-multiq-c1",
  "jevbench-multiq-c4",
]
repetitions = 3

[presets.release]
cases = [
  "jevbench-full-128-c1",
  "jevbench-single-c1-p2",
  "jevbench-single-c8",
  "jevbench-multiq-c1",
  "jevbench-multiq-c4",
]
repetitions = 5

[engine_defaults]
support = "supported"
engine = "warp-34"
version = "current-tree"
gpu_count = 1
parallelism = "single"
base_url = "http://127.0.0.1:18034/v1"
source_model_revision = "same as model_revision"
artifact_sha256 = "pinned-hf-revision"
tokenizer_revision = "same as model_revision"
chat_template_sha256 = "pinned-hf-revision"
quantization_details = "native checkpoint or W4A16 GPTQ"
activation_dtype = "float16"
conv_state_dtype = "float16"
kv_format = "fp16"
speculation = "none"
cache_config = "256 FP16 pages; FP32 SSM; synchronous decision wave submission + 100us burst coalescing"

# ---------------------------------------------------------------------------
# fastino/GLiDE-* (CodeReadout, noncausal_full_attention + damped-Euler midloop on 9B/27B)
# ---------------------------------------------------------------------------

[[engines]]
id = "warp34-glide-0_8b-tp1"
cohort = "glide-code-readout"
model = "fastino/GLiDE-0.8B"
model_revision = "9eacdeec79fa48ec52a8d6f54b331376b4bbfaf0"
weight_format = "bf16-safetensors"
launch_command = "PATH=/opt/cuda/bin:$PATH CUDA_VISIBLE_DEVICES=0 ./target/release/w34 serve --model fastino/GLiDE-0.8B --revision 9eacdeec79fa48ec52a8d6f54b331376b4bbfaf0 --tp 1 --kv-format fp16 --kv-pages 256 --host 127.0.0.1 --port 18034"

