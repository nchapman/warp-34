[workspace]
resolver = "2"
members = ["crates/warp34-kernels", "crates/warp34-host"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/nchapman/warp34"
homepage = "https://github.com/nchapman/warp34"
readme = "README.md"
keywords = ["llm", "inference", "cuda", "qwen", "speculative-decoding"]
categories = ["science", "command-line-utilities"]

[workspace.lints.rust]
unsafe_code = "allow"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn" }
cognitive_complexity = "warn"
undocumented_unsafe_blocks = "warn"
missing_safety_doc = "warn"
assigning_clones = "warn"
bool_to_int_with_if = "warn"
checked_conversions = "warn"
cloned_instead_of_copied = "warn"
dbg_macro = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
large_futures = "warn"
manual_assert = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
needless_continue = "warn"
redundant_closure = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
todo = "warn"
trivially_copy_pass_by_ref = "warn"
unimplemented = "warn"
uninlined_format_args = "warn"
use_self = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
