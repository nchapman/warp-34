[package]
name = "w34-host"
description = "Host runtime, loader, scheduler, and server for warp-34"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "w34"
path = "src/main.rs"

[features]
default = []
cuda = ["w34-kernels/cuda"]

[dependencies]
w34-kernels = { path = "../w34-kernels" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokenizers = "0.21"
llguidance = "=1.9.1"
toktrie_hf_tokenizers = "=1.9.1"
# Resolver API is unversioned; pin the audited public-address filtering seam.
ureq = { version = "=3.5.0", default-features = false, features = ["rustls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
