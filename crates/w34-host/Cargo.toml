[package]
name = "w34-host"
description = "Host runtime, loader, scheduler, and server for warp-34"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "w34"
path = "src/main.rs"

[features]
default = []
cuda = ["w34-kernels/cuda"]

[dependencies]
fancy-regex = "0.14"
libc = "0.2"
w34-kernels = { path = "../w34-kernels" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
axum = "0.8"
sha2 = "0.10"
subtle = "2"
include_dir = "0.7.4"
hf-hub = { version = "=1.0.0", features = ["blocking", "rustls-tls"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "signal", "time", "macros"] }
tokio-stream = "0.1"
async-stream = "0.3"
tokenizers = "0.22"
xgrammar-rs = { version = "=0.2.8", features = ["tokenizers"] }
# Resolver API is unversioned; pin the audited public-address filtering seam.
ureq = { version = "=3.5.0", default-features = false, features = ["rustls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Use the supported v3 API directly: the safe wrapper lacks memory/scan limits.
# Bundled static libjpeg-turbo; no system library or Python runtime required.
turbojpeg-sys = { version = "=1.2.0", default-features = false, features = ["cmake"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
