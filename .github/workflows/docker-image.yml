name: docker-image

# CI: CPU-side checks (dashboard, rustfmt, clippy, unit/doc tests, Python suites)
# + the multi-stage Docker image build (which compiles all CUDA kernels with nvcc
# and links the full `--features cuda` release binary).
# Pushes to GHCR on pushes to main (`:dev` + `:sha-<full>`) and `v*` release tags
# (`:X.Y.Z`, `:X.Y`, `:latest`, `:sha-<full>`).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  checks:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: Install pnpm and build dashboard
        run: |
          npm install --global pnpm@12.10.1
          pnpm --dir dashboard install --frozen-lockfile
          pnpm --dir dashboard check
          pnpm --dir dashboard build
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target
          key: checks-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Format, clippy, and CPU test suites
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --lib
          cargo test --doc
          python3 -m unittest discover -s tools/oracle -p 'test_*.py' -v
          cd benchmarks/perf && python3 -m unittest discover -s tests -v && python3 -m w34perf validate suite.toml

  image:
    needs: checks
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # The CUDA 13.4.1 devel base extracts to ~9 GB and hosted runners ship
      # with ~14 GB free — evict unused preinstalled toolchains first (~25 GB).
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Tag semantics:
          #   vX.Y.Z tag  -> X.Y.Z + rolling X.Y + latest (stable releases only)
          #   main        -> dev (latest never tracks main)
          #   every build -> sha-<full> (immutable pin/rollback)
          flavor: |
            latest=false
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
