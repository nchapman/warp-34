name: docker

# CI: CPU-side checks (dashboard, rustfmt, clippy, unit/doc tests, Python suites)
# + the multi-stage Docker image build (which compiles all CUDA kernels with nvcc
# and links the full `--features cuda` release binary).
# Pushes to GHCR on pushes to main (`:dev` + `:sha-<full>`) and `v*` release tags
# (`:X.Y.Z`, `:X.Y`, `:latest`, `:sha-<full>`).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CARGO_INCREMENTAL: 0

jobs:
  checks:
    runs-on: sprinters:aws:ubuntu-24.04-slim:m7a.xlarge:temp=gp3/24/max/max:spot=rerun
    outputs:
      build_image: ${{ steps.filter.outputs.build_image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        name: Determine whether Docker image build is needed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "build_image=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "build_image=true" >> "$GITHUB_OUTPUT"
          else
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              RANGE="${BEFORE}..${{ github.sha }}"
            elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              RANGE="HEAD~1..HEAD"
            else
              RANGE=""
            fi
            if [ -z "$RANGE" ] || git diff --name-only "$RANGE" | grep -qE '^(Dockerfile|\.dockerignore|Cargo\.(toml|lock)|\.cargo/|crates/|dashboard/|\.github/workflows/docker\.yml$)'; then
              echo "build_image=true" >> "$GITHUB_OUTPUT"
            else
              echo "Skipping Docker image build (only docs/benchmarks/non-container files changed in $RANGE)."
              echo "build_image=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('dashboard/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
      - name: Install pnpm and build dashboard
        run: |
          corepack enable
          corepack prepare pnpm@12.10.1 --activate
          pnpm --dir dashboard config set store-dir ~/.pnpm-store
          pnpm --dir dashboard install --frozen-lockfile
          pnpm --dir dashboard check
          pnpm --dir dashboard build
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: checks-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            checks-${{ runner.os }}-
      - name: Format, clippy, and CPU test suites
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --lib
          cargo test --doc
          python3 -m unittest discover -s tools/oracle -p 'test_*.py' -v
          cd benchmarks/perf && python3 -m unittest discover -s tests -v && python3 -m warp34perf validate suite.toml

  image:
    needs: checks
    if: needs.checks.outputs.build_image == 'true'
    runs-on: sprinters:aws:ubuntu-24.04-minimal:m7a.4xlarge:temp=gp3/48/max/max:spot=rerun
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Tag semantics:
          #   vX.Y.Z tag  -> X.Y.Z + rolling X.Y + latest (stable releases only)
          #   main        -> dev (latest never tracks main)
          #   every build -> sha-<full> (immutable pin/rollback)
          flavor: |
            latest=false
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WARP34_NVCC_JOBS=16
          cache-from: type=gha
          cache-to: type=gha,mode=max
