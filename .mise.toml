[tools]
"cargo:cargo-llvm-cov" = "0.8.3"
rust = "1.99.0"

[env]
_.file = { path = ".env", ignored_if_missing = true }

[tasks.build]
description = "Build release binary with CUDA kernels"
run = "cargo build --release --features cuda"

[tasks.fmt]
description = "Format all Rust code"
run = "cargo fmt"

[tasks.fmt-check]
description = "Check Rust formatting"
run = "cargo fmt --check"

[tasks.clippy]
description = "Clippy with CUDA feature enabled"
run = "cargo clippy --features cuda --all-targets -- -D warnings"

[tasks."clippy-cpu"]
description = "Clippy without CUDA feature"
run = "cargo clippy --all-targets -- -D warnings"

[tasks."check-quick"]
description = "Format check + clippy (both feature states)"
depends = ["fmt-check", "clippy", "clippy-cpu"]

[tasks."test-quick"]
description = "Unit tests only (lib target with CUDA)"
run = "cargo test --release --features cuda --lib"

[tasks.test]
description = "Full release test suite with CUDA"
run = "cargo test --release --features cuda"

[tasks.check]
description = "Format check, clippy (both states), and full release test suite"
depends = ["fmt-check", "clippy", "clippy-cpu", "test"]

[tasks."oracle-dump"]
description = "Run w34 dump-diff TP=1 vs TP=2 parity across plain, Vision, MTP, DFlash2, and 35B-A3B MoE"
depends = ["build"]
run = """
./target/release/w34 dump-diff --model nchapman/Qwen3.5-4B-W4A16-GPTQ --kv-format tq4 --compare-tp2
./target/release/w34 dump-diff --model nchapman/Qwen3.5-4B-W4A16-GPTQ --kv-format tq4 --image https://w34.test/sample.ppm --compare-tp2
./target/release/w34 dump-diff --model nchapman/Qwen3.5-4B-W4A16-GPTQ --kv-format tq4 --speculative mtp --mtp-k 3 --compare-tp2
./target/release/w34 dump-diff --model nchapman/Qwen3.5-4B-W4A16-GPTQ --kv-format tq4 --speculative dflash2 --draft-model nchapman/Qwen3.5-4B-DFlash2 --compare-tp2
./target/release/w34 dump-diff --model llmfan46/Qwen3.6-35B-A3B-uncensored-heretic-Native-MTP-Preserved-GPTQ-Int4 --kv-format tq4 --kv-pages 64 --compare-tp2
./target/release/w34 dump-diff --model llmfan46/Qwen3.6-35B-A3B-uncensored-heretic-Native-MTP-Preserved-GPTQ-Int4 --kv-format tq4 --kv-pages 64 --speculative mtp --mtp-k 3 --compare-tp2
"""

[tasks."oracle-greedy"]
description = "Run w34 greedy-diff with boundary-anchored TQ4, lossless speculative, and warm radix verification"
depends = ["build"]
run = """
./target/release/w34 greedy-diff --model nchapman/Qwen3.5-4B-W4A16-GPTQ --golden tools/oracle/goldens/4B --max-prompts 4 --max-tokens 32 --kv-format tq4 --speculative mtp --mtp-k 3 --verify-lossless --verify-radix-warm
./target/release/w34 greedy-diff --model nchapman/Qwen3.5-4B-W4A16-GPTQ --golden tools/oracle/goldens/4B --max-prompts 4 --max-tokens 32 --kv-format tq4 --speculative dflash2 --draft-model nchapman/Qwen3.5-4B-DFlash2 --verify-lossless --verify-radix-warm
"""

[tasks."bench-all"]
description = "Run multi-stage w34 bench (decode + radix + scheduler + vision) across plain, MTP, DFlash2, and 35B-A3B MoE"
depends = ["build"]
run = """
./target/release/w34 bench --model nchapman/Qwen3.5-4B-W4A16-GPTQ --stage all --kv-format tq4 --prompt-len 128 --gen-len 128 --batch-size 8
./target/release/w34 bench --model nchapman/Qwen3.5-4B-W4A16-GPTQ --stage all --kv-format tq4 --prompt-len 128 --gen-len 128 --batch-size 8 --speculative mtp --mtp-k 3
./target/release/w34 bench --model nchapman/Qwen3.5-4B-W4A16-GPTQ --stage all --kv-format tq4 --prompt-len 128 --gen-len 128 --batch-size 8 --speculative dflash2 --draft-model nchapman/Qwen3.5-4B-DFlash2
./target/release/w34 bench --model llmfan46/Qwen3.6-35B-A3B-uncensored-heretic-Native-MTP-Preserved-GPTQ-Int4 --tp 2 --stage decode --kv-format tq4 --kv-pages 128 --prompt-len 64 --gen-len 64
./target/release/w34 bench --model llmfan46/Qwen3.6-35B-A3B-uncensored-heretic-Native-MTP-Preserved-GPTQ-Int4 --tp 2 --stage decode --kv-format tq4 --kv-pages 128 --prompt-len 64 --gen-len 64 --speculative mtp --mtp-k 3
"""

[tasks."profile-live"]
description = "Capture live nsys SQLite profiles and render category scoreboards vs vLLM/SGLang"
depends = ["build"]
run = """
./target/release/w34 profile-diff --live --preset vllm_4b_tp1_decode --model nchapman/Qwen3.5-4B-W4A16-GPTQ --tp 1 --kv-format tq4
./target/release/w34 profile-diff --live --preset vllm_4b_tp1_mtp_k3 --model nchapman/Qwen3.5-4B-W4A16-GPTQ --tp 1 --kv-format tq4 --speculative mtp --mtp-k 3
./target/release/w34 profile-diff --live --preset sglang_4b_tp1_dflash2_m16 --model nchapman/Qwen3.5-4B-W4A16-GPTQ --tp 1 --kv-format tq4 --speculative dflash2 --draft-model nchapman/Qwen3.5-4B-DFlash2
./target/release/w34 profile-diff --live --preset vllm_35b_moe_tp2_decode --model llmfan46/Qwen3.6-35B-A3B-uncensored-heretic-Native-MTP-Preserved-GPTQ-Int4 --tp 2 --kv-format tq4 --kv-pages 128
"""
