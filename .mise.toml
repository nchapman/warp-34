[tools]
node = "24.21.0"
pnpm = "12.10.1"
"cargo:cargo-llvm-cov" = "0.8.3"
rust = "1.99.0"
python = "3.12.12"

[env]
_.file = { path = ".env", ignored_if_missing = true }

[tasks."dashboard-install"]
description = "Install locked dashboard dependencies"
run = "pnpm --dir dashboard install --frozen-lockfile"

[tasks."dashboard-build"]
description = "Build React/Vite assets for embedding in w34"
depends = ["dashboard-install"]
run = "pnpm --dir dashboard build"

[tasks."dashboard-check"]
description = "Typecheck, format-check, and test the dashboard"
depends = ["dashboard-install"]
run = "pnpm --dir dashboard check"

[tasks."dashboard-dev"]
description = "Vite dev server; proxies metrics to w34 on localhost:8000"
depends = ["dashboard-install"]
run = "pnpm --dir dashboard dev"

[tasks.build]
description = "Build release binary with CUDA kernels and embedded dashboard"
depends = ["dashboard-build"]
run = "cargo build --release --features cuda"

[tasks.fmt]
description = "Format all Rust code"
run = "cargo fmt"

[tasks.fmt-check]
description = "Check Rust formatting"
run = "cargo fmt --check"

[tasks.clippy]
description = "Clippy with CUDA feature enabled"
depends = ["dashboard-build"]
run = "cargo clippy --features cuda --all-targets -- -D warnings"

[tasks."clippy-cpu"]
description = "Clippy without CUDA feature"
depends = ["dashboard-build"]
run = "cargo clippy --all-targets -- -D warnings"

[tasks."doc-check"]
description = "Check Rust documentation with warnings denied"
depends = ["dashboard-build"]
run = "RUSTDOCFLAGS='-D warnings' cargo doc --no-deps --features cuda"

[tasks."simd-check"]
description = "Static assembly & llvm-mca audit for CPU SIMD kernels across AVX2/AVX-512 microarchitectures"
run = "python3 tools/check_cpu_simd.py"

[tasks."check-quick"]
description = "Format check, clippy (both feature states), rustdoc check, and CPU SIMD assembly audit"
depends = ["fmt-check", "clippy", "clippy-cpu", "doc-check", "simd-check"]

[tasks."test-quick"]
description = "Unit tests only (lib target with CUDA)"
depends = ["dashboard-build"]
run = "cargo test --release --features cuda --lib"

[tasks."test-cpu"]
description = "Fast CPU-only suite: unit tests plus CPU-runnable integration tests"
depends = ["dashboard-build"]
run = "cargo test --lib --tests"

[tasks."doc-test"]
description = "Run library documentation tests"
run = "cargo test --doc"

[tasks.coverage]
description = "Fast library code coverage report with CUDA"
depends = ["dashboard-build"]
run = "cargo llvm-cov --features cuda --lib --summary-only"

[tasks."coverage-full"]
description = "Full library + integration test code coverage report with CUDA"
depends = ["dashboard-build"]
run = "cargo llvm-cov --features cuda --lib --tests --summary-only -- --test-threads=1"

[tasks."coverage-html"]
description = "Generate HTML coverage report for lib with CUDA"
depends = ["dashboard-build"]
run = "cargo llvm-cov --features cuda --lib --html"

[tasks."test-prep"]
description = "Verify and download pinned core test checkpoints (4B GPTQ, 4B DFlash2, clef-flash tokenizer)"
run = "python3 tools/prep_test_models.py"

[tasks."test-prep-all"]
description = "Verify and download all pinned test and qualification checkpoints (2B, 4B, 9B, 27B, 35B-A3B, Flash-Next)"
run = "python3 tools/prep_test_models.py --all"

[tasks.test]
description = "Full release test suite with CUDA"
depends = ["dashboard-build"]
run = "cargo test --release --features cuda"

[tasks.check]
description = "Format check, clippy (both states), rustdoc check, and full release test suite"
depends = ["fmt-check", "clippy", "clippy-cpu", "doc-check", "test", "oracle-check", "perf-check", "dashboard-check"]

[tasks."perf-check"]
description = "CPU-only tests and manifest validation for the independent performance suite"
run = "cd benchmarks/perf && python3 -m unittest discover -s tests -v && python3 -m w34perf validate suite.toml"

[tasks."quality-run"]
description = "Run the sequential four-engine FP16-KV quality suite (defaults to 10 examples/task)"
run = "python3 benchmarks/quality/run_suite.py"

[tasks."quality-check"]
description = "CPU-only quality runner and upstream lm-eval configuration tests (install quality environment first)"
run = "benchmarks/quality/.venv/bin/python -m unittest discover -s benchmarks/quality/tests -v"

[tasks."oracle-check"]
description = "Host-only validation of real-image oracle and long-context gate harnesses"
run = "python3 -m unittest discover -s tools/oracle -p 'test_*.py' -v"

[tasks."vision-gates"]
description = "Capture and replay six real PNG/JPEG vLLM oracles (select one free GPU)"
run = "python3 tools/oracle/vision_matrix.py --out-dir outputs/vision-$(date +%Y%m%d-%H%M%S)"

[tasks."needle-gates"]
description = "Run all eight 1-GPU 27B TQ4/TQ4-all 32k-262k needle gates (set CUDA_VISIBLE_DEVICES to one GPU)"
run = "python3 tools/oracle/needle_matrix.py"

[tasks."oracle-dump"]
description = "Run w34 dump-diff TP=1 vs TP=2 parity across plain, Vision, MTP, DFlash2, and 35B-A3B MoE"
depends = ["build"]
run = """
./target/release/w34 dump-diff --model nchapman/Qwen3.5-4B-W4A16-GPTQ --kv-format tq4 --compare-tp2
./target/release/w34 dump-diff --model nchapman/Qwen3.5-4B-W4A16-GPTQ --kv-format tq4 --image rgb://https://w34.test/sample.ppm --compare-tp2
./target/release/w34 dump-diff --model nchapman/Qwen3.5-4B-W4A16-GPTQ --kv-format tq4 --speculative mtp --mtp-k 3 --compare-tp2
./target/release/w34 dump-diff --model nchapman/Qwen3.5-4B-W4A16-GPTQ --kv-format tq4 --speculative dflash2 --draft-model nchapman/Qwen3.5-4B-DFlash2 --compare-tp2
./target/release/w34 dump-diff --model llmfan46/Qwen3.6-35B-A3B-uncensored-heretic-Native-MTP-Preserved-GPTQ-Int4 --kv-format tq4 --kv-pages 64 --compare-tp2
./target/release/w34 dump-diff --model llmfan46/Qwen3.6-35B-A3B-uncensored-heretic-Native-MTP-Preserved-GPTQ-Int4 --kv-format tq4 --kv-pages 64 --speculative mtp --mtp-k 3 --compare-tp2
"""

[tasks."oracle-greedy"]
description = "Run w34 greedy-diff with boundary-anchored TQ4, lossless speculative, and warm radix verification"
depends = ["build"]
run = """
./target/release/w34 greedy-diff --model nchapman/Qwen3.5-4B-W4A16-GPTQ --golden tools/oracle/goldens/4B --max-prompts 4 --max-tokens 32 --kv-format tq4 --speculative mtp --mtp-k 3 --verify-lossless --verify-radix-warm
./target/release/w34 greedy-diff --model nchapman/Qwen3.5-4B-W4A16-GPTQ --golden tools/oracle/goldens/4B --max-prompts 4 --max-tokens 32 --kv-format tq4 --speculative dflash2 --draft-model nchapman/Qwen3.5-4B-DFlash2 --verify-lossless --verify-radix-warm
"""

[tasks."bench-all"]
description = "Run multi-stage w34 bench (decode + radix + scheduler + vision) across plain, MTP, DFlash2, and 35B-A3B MoE"
depends = ["build"]
run = """
./target/release/w34 bench --model nchapman/Qwen3.5-4B-W4A16-GPTQ --stage all --kv-format tq4 --prompt-len 128 --gen-len 128 --batch-size 8
./target/release/w34 bench --model nchapman/Qwen3.5-4B-W4A16-GPTQ --stage all --kv-format tq4 --prompt-len 128 --gen-len 128 --batch-size 8 --speculative mtp --mtp-k 3
./target/release/w34 bench --model nchapman/Qwen3.5-4B-W4A16-GPTQ --stage all --kv-format tq4 --prompt-len 128 --gen-len 128 --batch-size 8 --speculative dflash2 --draft-model nchapman/Qwen3.5-4B-DFlash2
./target/release/w34 bench --model llmfan46/Qwen3.6-35B-A3B-uncensored-heretic-Native-MTP-Preserved-GPTQ-Int4 --tp 2 --stage decode --kv-format tq4 --kv-pages 128 --prompt-len 64 --gen-len 64
./target/release/w34 bench --model llmfan46/Qwen3.6-35B-A3B-uncensored-heretic-Native-MTP-Preserved-GPTQ-Int4 --tp 2 --stage decode --kv-format tq4 --kv-pages 128 --prompt-len 64 --gen-len 64 --speculative mtp --mtp-k 3
"""

[tasks."profile-live"]
description = "Capture live nsys SQLite profiles and render category scoreboards vs vLLM/SGLang"
depends = ["build"]
run = """
./target/release/w34 profile-diff --live --preset vllm_4b_tp1_decode --model nchapman/Qwen3.5-4B-W4A16-GPTQ --tp 1 --kv-format tq4
./target/release/w34 profile-diff --live --preset vllm_4b_tp1_mtp_k3 --model nchapman/Qwen3.5-4B-W4A16-GPTQ --tp 1 --kv-format tq4 --speculative mtp --mtp-k 3
./target/release/w34 profile-diff --live --preset sglang_4b_tp1_dflash2_m16 --model nchapman/Qwen3.5-4B-W4A16-GPTQ --tp 1 --kv-format tq4 --speculative dflash2 --draft-model nchapman/Qwen3.5-4B-DFlash2
./target/release/w34 profile-diff --live --preset vllm_35b_moe_tp2_decode --model llmfan46/Qwen3.6-35B-A3B-uncensored-heretic-Native-MTP-Preserved-GPTQ-Int4 --tp 2 --kv-format tq4 --kv-pages 128
"""
